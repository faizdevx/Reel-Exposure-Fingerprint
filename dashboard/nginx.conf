# One request a second per client address on the API paths, with a burst for a page that loads
# several resources at once. The API also limits (app/ratelimit.py); this stops a flood earlier.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

# When Caddy (hosted mode) or any other proxy sits in front, the connection comes from it. Take the
# client address from X-Forwarded-For, but only through private networks, and from the right: what
# the client put at the left of the header is ignored.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing the API accepts is larger (frames: 800 KB). The API enforces its own, smaller limits.
    client_max_body_size 1m;

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Append the address we saw. A client can put entries at the left, never at the right, and
        # the API takes the right-most address that is not one of its own proxies
        # (REF_TRUSTED_PROXIES), so it cannot choose its own rate-limit key.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
